<script>
(function(){

async function dl(data,name,m){

/* ---------- tiny markdown renderer (escapes first, so it is safe) ---------- */
function inl(x){return x.replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>').replace(/(^|[^*])\*([^*\s][^*]*)\*/g,'$1<i>$2</i>').replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,'<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>')}
function md(src,hb){
 hb=hb==null?2:hb;const L=String(src).replace(/\r/g,'').split('\n');let o='',i=0,list=null;

/* ---------- Claude access ---------- */
let _s=null;
async function getSample(){if(_s)return _s;try{const s=window.claude?await window.claude.use('sample'):null;if(s)_s=s;return s||null}catch(e){return null}}

const MODES={
 'Assistant':'You are Claude, a friendly and capable assistant inside the ToolBox web app.',
 'Writer':'You are an expert writing assistant. Produce polished, ready-to-use text.',
 'Coder':'You are a senior software engineer. Give correct, minimal code in fenced code blocks with a short explanation.',
 'Tutor':'You are a patient tutor. Explain step by step, use simple examples and check understanding.',
 'Brief':'Answer in as few words as possible. Use bullets only when they help.'
};
const SUGG=['Write a polite email asking a client to pay an overdue invoice','Explain input tax credit in GST in simple words','Make a 3-day study plan for a statistics exam','Why does my JavaScript fetch return a Promise?'];
const CH={msgs:st.get('chat',[]),mode:st.get('chatmode','Assistant'),busy:false,ctl:null,view:null};
if(!MODES[CH.mode])CH.mode='Assistant';
function saveChat(){st.set('chat',CH.msgs.filter(m=>!m.pending).slice(-40))}
function buildHistory(){
 const arr=[];
 CH.msgs.forEach(m=>{if(m.err||m.pending||!m.content)return;const last=arr[arr.length-1];if(last&&last.role===m.role)last.content+='\n\n'+m.content;else arr.push({role:m.role,content:m.content})});
 let h=arr.slice(-24);while(h.length&&h[0].role!=='user')h.shift();
 if(h.length)h[0]={role:'user',content:'[Instructions: '+MODES[CH.mode]+' Reply in the language the user writes in. Short paragraphs; markdown lists and code blocks are fine.]\n\n'+h[0].content};
 return h;
}
let raf=0;
function renderSoon(){if(!raf)raf=requestAnimationFrame(()=>{raf=0;renderChat()})}
function renderChat(){
 const v=CH.view;if(!v)return;
 const near=v.list.scrollHeight-v.list.scrollTop-v.list.clientHeight<90;
 v.list.innerHTML='';
 if(!CH.msgs.length){
  const e=el('div',{'class':'c-empty'},'<b>Ask Claude anything</b><p>Writing, maths, code, ideas, explanations. The chat is saved in this browser.</p><div class="sugg"></div>');
  SUGG.forEach(s=>{const b=el('button',{type:'button'});b.textContent=s;b.onclick=()=>sendMsg(s);$('.sugg',e).appendChild(b)});
  v.list.appendChild(e);
 }
 CH.msgs.forEach(m=>{
  const d=el('div',{'class':'bub '+(m.role==='user'?'u':'a')+(m.err?' err':'')});
  if(m.role==='user')d.textContent=m.content;
  else{
   if(m.pending&&!m.content)d.textContent='Thinking…';else d.innerHTML='<div class="rich">'+md(m.content,2)+'</div>';
   if(!m.pending&&m.content&&!m.err){
    const a=el('div',{'class':'bact'}),c=el('button',{'class':'btn sec sm',type:'button'},'Copy'),n=el('button',{'class':'btn sec sm',type:'button'},'Add to Notes');
    c.onclick=()=>copy(m.content,v.msg);n.onclick=()=>{addNote('Claude: '+(m.content.replace(/\s+/g,' ').slice(0,40)),m.content);say(v.msg,'Added to Notes ✓')};
    a.append(c,n);d.appendChild(a);
   }
  }
  v.list.appendChild(d);
 });
 v.send.hidden=CH.busy;v.stop.hidden=!CH.busy;
 if(near||CH.busy)v.list.scrollTop=v.list.scrollHeight;
}
async function sendMsg(text){
 text=(text||'').trim();if(!text||CH.busy||!CH.view)return;
 CH.busy=true;
 const s=await getSample();
 CH.msgs.push({role:'user',content:text});
 if(!s){CH.msgs.push({role:'assistant',content:'Claude is not available here. Open this page inside Claude to use chat and the AI tools.',err:1});CH.busy=false;saveChat();renderChat();return}
 const a={role:'assistant',content:'',pending:true};CH.msgs.push(a);
 const ctl=CH.ctl=new AbortController();renderChat();
 try{
  const r=await s(buildHistory(),{onText:x=>{a.content=x.text;renderSoon()},signal:ctl.signal,cache:false});
  a.content=r.text+(r.truncated?'\n\n_The answer was cut short. Ask me to continue._':'');
 }catch(e){
  if(ctl.signal.aborted)a.content=(e&&e.text)||a.content||'Stopped.';
  else{a.err=1;a.content=aiMsg(e)}
 }
 a.pending=false;CH.busy=false;CH.ctl=null;saveChat();renderChat();
}
function mountChat(root){

 const v=CH.view={root:root,list:$('.c-list',root),inp:$('.c-in',root),send:$('.c-send',root),stop:$('.c-stop',root),msg:$('.c-msg',root)};
 const ms=$('.c-mode',root);Object.keys(MODES).forEach(k=>{const o=el('option');o.textContent=k;ms.appendChild(o)});ms.value=CH.mode;
 ms.onchange=()=>{CH.mode=ms.value;st.set('chatmode',CH.mode)};
 $('.c-new',root).onclick=()=>{if(CH.ctl)CH.ctl.abort();CH.msgs=[];saveChat();renderChat()};
 const go=()=>{const t=v.inp.value;v.inp.value='';sendMsg(t)};
 v.send.onclick=go;v.stop.onclick=()=>{if(CH.ctl)CH.ctl.abort()};

function ai(b,id,fs,mk,o){
 o=o||{};const sv=st.get('ai.'+id,{});
 b.innerHTML=fs.map(f=>{
  const n='f_'+f[1];let h='<div class="fld"><label for="'+n+'">'+f[0]+'</label>';
  if(f[2]==='select')h+='<select id="'+n+'">'+f[3].map(x=>'<option>'+x+'</option>').join('')+'</select>';
  else if(f[2]==='area')h+='<textarea id="'+n+'" class="sans" style="min-height:'+(f[4]||90)+'px" placeholder="'+(f[3]||'')+'"></textarea>';
  else h+='<input type="text" id="'+n+'" placeholder="'+(f[3]||'')+'">';
  return h+'</div>';
 }).join('')
 +'<div class="row"><button class="btn" id="go" type="button">✦ Generate with Claude</button><button class="btn sec" id="stop" type="button" hidden>Stop</button><button class="btn sec" id="cp" type="button">Copy</button><button class="btn sec" id="sv" type="button">Save .txt</button><button class="btn sec" id="nt" type="button">Add to Notes</button><button class="btn sec" id="fu" type="button">Follow up in chat</button></div>'
 +(o.md?'<div class="out rich" id="out" aria-live="polite">Your result appears here.</div>':'<textarea id="out" class="sans" style="min-height:260px" aria-label="Result" placeholder="Your result appears here…"></textarea>')+MSG;
 fs.forEach(f=>{if(f[2]==='area')return;const x=$('#f_'+f[1],b),v=sv[f[1]];
  if(v!=null&&(f[2]!=='select'||Array.from(x.options).some(op=>op.value===v)))x.value=v;
  x.addEventListener('change',()=>{const c=st.get('ai.'+id,{});c[f[1]]=x.value;st.set('ai.'+id,c)})});
 const out=$('#out',b),m=$('.msg',b),go=$('#go',b),stop=$('#stop',b);let busy=false,ctl=null,last='';
 const setOut=t=>{last=t;if(o.md)out.innerHTML=md(t,3);else out.value=t};
 const getOut=()=>o.md?last:out.value;
 go.onclick=async()=>{
  if(busy)return;
  const v={};fs.forEach(f=>{v[f[1]]=$('#f_'+f[1],b).value.trim()});
  if(!v[fs[0][1]]){say(m,'Fill in the first field to start.',1);return}
  busy=true;go.disabled=true;say(m,'Asking Claude…');
  const s=await getSample();
  if(!s){say(m,'AI tools work when this page is open in Claude.',1);busy=false;go.disabled=false;return}
  ctl=new AbortController();stop.hidden=false;say(m,'Claude is writing…');
  try{
   const r=await s(mk(v),{onText:x=>setOut(x.text),signal:ctl.signal,cache:false});
   setOut(r.text);say(m,r.truncated?'Done. The output was shortened, so try a smaller input.':'Done ✓');
  }catch(e){
   if(ctl.signal.aborted){if(e&&e.text)setOut(e.text);say(m,'Stopped.')}else say(m,aiMsg(e),1);
  }
  busy=false;go.disabled=false;stop.hidden=true;
 };
 stop.onclick=()=>{if(ctl)ctl.abort()};
 $('#cp',b).onclick=()=>{const t=getOut();if(!t){say(m,'Nothing to copy yet.',1);return}copy(t,m)};
 $('#sv',b).onclick=()=>{const t=getOut();if(!t){say(m,'Nothing to save yet.',1);return}dl(t,'toolbox-'+id+'.txt',m)};
 $('#nt',b).onclick=()=>{const t=getOut();if(!t){say(m,'Nothing to add yet.',1);return}addNote(id.replace(/^ai-/,'').replace(/-/g,' '),t);say(m,'Added to Notes ✓')};
 $('#fu',b).onclick=()=>{const t=getOut();if(!t){say(m,'Generate something first.',1);return}openChat('Here is a draft you wrote for me:\n\n'+t+'\n\nPlease improve it: ',false)};
}

function calc(b,fs,fn){
 b.innerHTML='<div class="row">'+fs.map(f=>'<div class="fld"><label>'+f[0]+'<input type="'+(f[2]||'number')+'" value="'+f[1]+'" step="any"></label></div>').join('')+'</div><div class="out"></div>';
 const ins=b.querySelectorAll('input'),o=$('.out',b);
 function up(){o.innerHTML=fn([].map.call(ins,i=>i.type==='number'?parseFloat(i.value):i.value))}
 [].forEach.call(ins,i=>{i.oninput=up});up();
}
const bar=(a,z,la,lz)=>{const t=a+z,p=t>0?Math.round(a/t*100):0;return '<div class="split" role="img" aria-label="'+la+' '+p+'%, '+lz+' '+(100-p)+'%"><i style="width:'+p+'%"></i></div><small>'+la+' '+p+'% · '+lz+' '+(100-p)+'%</small>'};
function picker(accept,note){
 const wrap=el('div',{},'<div class="drop" tabindex="0" role="button" aria-label="Choose files"><b>Drop files here</b> or click to choose<br><small>'+note+'</small></div><input type="file" accept="'+accept+'" multiple hidden><div class="files"></div>');
 const dz=$('.drop',wrap),inp=$('input',wrap),box=$('.files',wrap);let files=[];
 const okf=f=>accept==='application/pdf'?(f.type==='application/pdf'||/\.pdf$/i.test(f.name)):f.type.indexOf('image/')===0;
 function draw(){
  box.innerHTML='';
  files.forEach((f,i)=>{
   const r=el('div',{'class':'frow'}),n=el('span',{'class':'fn'}),u=el('button',{'class':'btn sec sm',type:'button','aria-label':'Move up'},'↑'),d=el('button',{'class':'btn sec sm',type:'button','aria-label':'Move down'},'↓'),x=el('button',{'class':'btn sec sm',type:'button','aria-label':'Remove'},'✕');
   n.textContent=(i+1)+'. '+f.name+' ('+sz(f.size)+')';
   u.onclick=()=>{if(i>0){const t=files[i-1];files[i-1]=files[i];files[i]=t;draw()}};
   d.onclick=()=>{if(i<files.length-1){const t=files[i+1];files[i+1]=files[i];files[i]=t;draw()}};
   x.onclick=()=>{files.splice(i,1);draw()};
   r.append(n,u,d,x);box.appendChild(r);
  });
 }
 const add=list=>{Array.from(list).filter(okf).forEach(f=>files.push(f));draw()};
 dz.onclick=()=>inp.click();dz.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();inp.click()}};
 inp.onchange=()=>{add(inp.files);inp.value=''};
 dz.ondragover=e=>{e.preventDefault();dz.classList.add('over')};dz.ondragleave=()=>dz.classList.remove('over');
 dz.ondrop=e=>{e.preventDefault();dz.classList.remove('over');add(e.dataTransfer.files)};
 return {el:wrap,get:()=>files};
}
function ranges(str,n){const s=new Set();str.split(',').forEach(p=>{p=p.trim();if(!p)return;const m=p.match(/^(\d+)?\s*-\s*(\d+)?$/);if(m&&(m[1]||m[2])){const a=m[1]?+m[1]:1,z=m[2]?+m[2]:n;for(let k=Math.max(1,a);k<=Math.min(n,z);k++)s.add(k-1)}else if(/^\d+$/.test(p)){const k=+p;if(k>=1&&k<=n)s.add(k-1)}});return Array.from(s).sort((x,y)=>x-y)}

 b.innerHTML='<div class="notes"><div><div class="row"><input type="search" id="nq" placeholder="Search notes" aria-label="Search notes"><button class="btn sm" id="nn" type="button">+ New</button></div><div id="nl" class="nl"></div></div><div><input type="text" id="nt" placeholder="Title" aria-label="Note title"><textarea id="nb" class="sans" style="min-height:300px;margin-top:8px" placeholder="Write here. Notes save automatically in this browser." aria-label="Note text"></textarea><div class="row"><button class="btn sec" id="ncp" type="button">Copy</button><button class="btn sec" id="nsv" type="button">Save .txt</button><button class="btn sec ai" id="nai" type="button">✦ Tidy with Claude</button><button class="btn sec" id="ndl" type="button">Delete</button></div>'+MSG+'</div></div>';
 const m=$('.msg',b),nt=$('#nt',b),nb=$('#nb',b),nl=$('#nl',b),ndl=$('#ndl',b);
 const save=()=>st.set('notes',ns),get=()=>ns.find(n=>n.id===cur);
 function draw(){
  nl.innerHTML='';
  const f=ns.filter(n=>(n.t+' '+n.b).toLowerCase().indexOf(q.toLowerCase())>-1);
  if(!f.length)nl.innerHTML='<div class="empty sm">'+(ns.length?'No notes match.':'No notes yet. Click + New.')+'</div>';
  f.forEach(n=>{const x=el('button',{'class':'nitem'+(n.id===cur?' on':''),type:'button'}),a=el('b'),s=el('small');a.textContent=n.t||'Untitled';s.textContent=new Date(n.u).toLocaleDateString()+' · '+(n.b.replace(/\s+/g,' ').slice(0,50)||'Empty');x.append(a,s);x.onclick=()=>{cur=n.id;load();draw()};nl.appendChild(x)});
 }
 function load(){const n=get();nt.value=n?n.t:'';nb.value=n?n.b:'';nt.disabled=nb.disabled=!n}
 function make(t,body){const n={id:newId(),t:t||'',b:body||'',u:Date.now()};ns.unshift(n);cur=n.id;save()}
 if(!ns.length)make('Welcome','This is a sample note. Notes are saved in this browser only. Use Tidy with Claude to clean up rough notes, or delete this one.');
 $('#nn',b).onclick=()=>{make('','');load();draw();nt.focus()};
 const edit=()=>{const n=get();if(!n)return;n.t=nt.value;n.b=nb.value;n.u=Date.now();ns.splice(ns.indexOf(n),1);ns.unshift(n);save();draw()};
 nt.oninput=edit;nb.oninput=edit;
 $('#nq',b).oninput=function(){q=this.value;draw()};
 $('#ncp',b).onclick=()=>copy(nb.value,m);
 $('#nsv',b).onclick=()=>{if(!nb.value){say(m,'This note is empty.',1);return}dl(nb.value,((nt.value||'note').replace(/[^\w\- ]+/g,'').trim()||'note')+'.txt',m)};
 ndl.onclick=()=>{
  if(!get())return;
  if(!armed){armed=1;ndl.textContent='Click again to delete';setTimeout(()=>{armed=0;ndl.textContent='Delete'},3000);return}
  armed=0;ndl.textContent='Delete';ns.splice(ns.indexOf(get()),1);cur=ns.length?ns[0].id:null;save();load();draw();say(m,'Note deleted.');
 };
 $('#nai',b).onclick=async()=>{
  if(busy||!nb.value.trim()){if(!nb.value.trim())say(m,'Write something first.',1);return}
  busy=true;say(m,'Claude is tidying your note…');
  try{const r=await claudeText('Tidy these rough notes: fix spelling, group related points under short headings, keep every fact, use plain text with "-" bullets. Return only the tidied notes.\n\n'+nb.value);make('Tidied: '+(nt.value||'note'),r.text);load();draw();say(m,'Saved as a new note ✓')}
  catch(e){say(m,aiMsg(e),1)}
  busy=false;
 };
 load();draw();
}},
{id:'todo',n:'To-do List',i:'✅',c:'Productivity',d:'A simple task list that remembers your tasks, with Claude to plan steps.',r(b){
 let ts=st.get('todo',[]),fl='all',busy=false;
 b.innerHTML='<div class="row"><input type="text" id="ti" placeholder="Add a task and press Enter" aria-label="New task"><button class="btn" id="ta" type="button">Add</button><button class="btn sec ai" id="tc" type="button">✦ Break into steps</button></div><div class="row" id="tf"></div><div id="tl" class="tl"></div><div class="row"><span id="tn" class="info" style="flex:1 1 auto"></span><button class="btn sec" id="tx" type="button">Clear completed</button></div>'+MSG;
 const m=$('.msg',b),ti=$('#ti',b),tl=$('#tl',b),save=()=>st.set('todo',ts);
 ['all','active','done'].forEach(k=>{const x=el('button',{'class':'btn sec sm',type:'button','data-k':k});x.textContent=k==='all'?'All':k==='active'?'Active':'Done';x.onclick=()=>{fl=k;draw()};$('#tf',b).appendChild(x)});
 function draw(){
  Array.from($('#tf',b).children).forEach(x=>x.classList.toggle('on',x.getAttribute('data-k')===fl));
  tl.innerHTML='';
  const v=ts.filter(t=>fl==='all'||(fl==='done')===!!t.d);
  if(!v.length)tl.innerHTML='<div class="empty sm">'+(ts.length?'Nothing here.':'No tasks yet. Add one above.')+'</div>';
  v.forEach(t=>{
   const r=el('div',{'class':'titem'+(t.d?' done':'')}),l=el('label'),c=el('input',{type:'checkbox'}),s=el('span'),x=el('button',{'class':'btn sec sm',type:'button','aria-label':'Delete task'},'✕');
   c.checked=!!t.d;s.textContent=t.t;c.onchange=()=>{t.d=c.checked;save();draw()};x.onclick=()=>{ts=ts.filter(z=>z!==t);save();draw()};
   l.append(c,s);r.append(l,x);tl.appendChild(r);
  });
  const left=ts.filter(t=>!t.d).length;$('#tn',b).textContent=left+' left · '+(ts.length-left)+' done';
 }
 const add=()=>{const t=ti.value.trim();if(!t)return;ts.unshift({id:newId(),t:t,d:0});ti.value='';save();draw()};
 $('#ta',b).onclick=add;ti.onkeydown=e=>{if(e.key==='Enter')add()};
 $('#tx',b).onclick=()=>{ts=ts.filter(t=>!t.d);save();draw()};
 $('#tc',b).onclick=async()=>{
  const g=ti.value.trim();if(!g){say(m,'Type a goal in the box first, for example "Launch my website".',1);return}
  if(busy)return;busy=true;say(m,'Claude is planning…');
  try{
   const r=await claudeText('Break this goal into 5 to 8 concrete, ordered tasks. One task per line, no numbering, no extra text.\nGoal: '+g);
   const lines=r.text.split('\n').map(x=>x.replace(/^[\s\-*•\d.)]+/,'').trim()).filter(Boolean).slice(0,10);
   lines.reverse().forEach(t=>ts.unshift({id:newId(),t:t,d:0}));ti.value='';save();draw();say(m,'Added '+lines.length+' tasks ✓');
  }catch(e){say(m,aiMsg(e),1)}
  busy=false;
 };
 draw();
}},
{id:'pomodoro',n:'Pomodoro Timer',i:'🍅',c:'Productivity',d:'Focus sessions with short and long breaks, counted per day.',r(b){
 const MD={focus:'Focus',short:'Short break',long:'Long break'},key='pomo.'+new Date().toISOString().slice(0,10);
 let mode='focus',run=0,endAt=0,left=0,n=st.get(key,0);
 b.innerHTML='<div class="row" id="pm"></div><div class="big" id="pd" role="timer">25:00</div><div class="split" style="background:var(--bd)"><i id="pb" style="width:0%"></i></div><div class="row"><button class="btn" id="ps" type="button">Start</button><button class="btn sec" id="pr" type="button">Reset</button></div><div class="row"><div class="fld"><label>Focus (min)<input type="number" id="mf" value="25" min="1" max="180"></label></div><div class="fld"><label>Short break (min)<input type="number" id="ms" value="5" min="1" max="60"></label></div><div class="fld"><label>Long break (min)<input type="number" id="ml" value="15" min="1" max="90"></label></div></div><div class="info" id="pc"></div>'+MSG;
 const m=$('.msg',b),pd=$('#pd',b),pb=$('#pb',b),ps=$('#ps',b);
 const dur=()=>Math.max(1,+$('#m'+(mode==='focus'?'f':mode==='short'?'s':'l'),b).value||1)*60000;
 const pad=x=>String(x).padStart(2,'0');
 function show(){const s=Math.ceil(left/1000);pd.textContent=pad(Math.floor(s/60))+':'+pad(s%60);pb.style.width=Math.max(0,Math.min(100,(1-left/dur())*100))+'%';ps.textContent=run?'Pause':'Start';$('#pc',b).textContent='Focus sessions completed today: '+n;Array.from($('#pm',b).children).forEach(x=>x.classList.toggle('on',x.getAttribute('data-k')===mode))}
 function set(k){mode=k;run=0;left=dur();show()}
 Object.keys(MD).forEach(k=>{const x=el('button',{'class':'btn sec',type:'button','data-k':k});x.textContent=MD[k];x.onclick=()=>{say(m,'');set(k)};$('#pm',b).appendChild(x)});
 function finish(){run=0;left=0;beep();if(mode==='focus'){n++;st.set(key,n);say(m,'Focus session complete. Time for a break.');mode=n%4===0?'long':'short'}else{say(m,'Break over. Ready to focus?');mode='focus'}left=dur();show()}
 const iv=setInterval(()=>{if(!document.body.contains(pd)){clearInterval(iv);return}if(run){left=endAt-Date.now();if(left<=0)finish();else show()}},250);
 ps.onclick=()=>{if(run){left=endAt-Date.now();run=0}else{endAt=Date.now()+left;run=1;say(m,'')}show()};
 $('#pr',b).onclick=()=>{say(m,'');set(mode)};
 ['mf','ms','ml'].forEach(i=>{$('#'+i,b).onchange=()=>{if(!run){left=dur();show()}}});
 set('focus');
}},

{id:'password-generator',n:'Password Generator',i:'🛡️',c:'Security',d:'Create strong random passwords.',r(b){
 b.innerHTML='<div class="fld"><label>Length: <b id="lv">16</b><input type="range" id="len" min="8" max="64" value="16"></label></div><div class="row"><label class="ck"><input type="checkbox" id="u" checked>A–Z</label><label class="ck"><input type="checkbox" id="l" checked>a–z</label><label class="ck"><input type="checkbox" id="n" checked>0–9</label><label class="ck"><input type="checkbox" id="s" checked>Symbols</label><label class="ck"><input type="checkbox" id="ax">Avoid look-alikes</label></div><div class="out mono" id="o">–</div><div class="info" id="en"></div><div class="row"><button class="btn" id="g" type="button">Generate</button><button class="btn sec" id="cp" type="button">Copy</button></div>'+MSG;
 const m=$('.msg',b),o=$('#o',b),len=$('#len',b);
 const sets={u:'ABCDEFGHIJKLMNOPQRSTUVWXYZ',l:'abcdefghijklmnopqrstuvwxyz',n:'0123456789',s:'!@#$%^&*()-_=+[]{};:,.?'};
 function gen(){
  const ks=Object.keys(sets).filter(k=>$('#'+k,b).checked);let set=ks.map(k=>sets[k]).join('');
  if($('#ax',b).checked)set=set.replace(/[0O1lI|]/g,'');
  if(!set){say(m,'Pick at least one character type.',1);return}
  const n=+len.value,max=Math.floor(4294967296/set.length)*set.length;let pw='';
  for(let tries=0;tries<50;tries++){
   const out=[];while(out.length<n){const a=new Uint32Array(n);crypto.getRandomValues(a);for(const x of a){if(x<max&&out.length<n)out.push(set[x%set.length])}}
   pw=out.join('');if(ks.every(k=>Array.from(pw).some(c=>sets[k].indexOf(c)>-1)))break;
  }
  o.textContent=pw;const bits=Math.round(n*Math.log2(set.length));
  $('#en',b).textContent=bits+' bits of entropy · '+(bits<60?'Weak':bits<80?'Okay':bits<100?'Strong':'Very strong');say(m,'');
 }
 len.oninput=()=>{$('#lv',b).textContent=len.value;gen()};
 ['u','l','n','s','ax'].forEach(k=>{$('#'+k,b).onchange=gen});
 $('#g',b).onclick=gen;$('#cp',b).onclick=()=>copy(o.textContent,m);gen();
}},
{id:'unit-converter',n:'Unit Converter',i:'📏',c:'Calculators',d:'Length, weight, area (cent, acre), volume, speed, time, data and temperature.',r(b){
 const U={Length:{m:1,km:1000,cm:.01,mm:.001,mile:1609.344,yard:.9144,ft:.3048,inch:.0254},
 Weight:{kg:1,g:.001,mg:1e-6,quintal:100,tonne:1000,lb:.45359237,oz:.028349523},
 Area:{'sq m':1,'sq km':1e6,hectare:1e4,acre:4046.8564224,cent:40.468564224,'sq ft':.09290304,'sq yd':.83612736,'sq in':.00064516},
 Volume:{litre:1,ml:.001,'cubic m':1000,'gallon (US)':3.785411784,cup:.2365882365,tbsp:.01478676478125,tsp:.00492892159375},
 Speed:{'m/s':1,'km/h':1/3.6,mph:.44704,knot:.5144444444,'ft/s':.3048},
 Time:{second:1,minute:60,hour:3600,day:86400,week:604800,'year (365 d)':31536000},
 Data:{byte:1,KB:1024,MB:1048576,GB:1073741824,TB:1099511627776},
 Temperature:{'°C':0,'°F':0,K:0}};
 b.innerHTML='<div class="row"><select id="cat" aria-label="Category"></select></div><div class="row"><input type="number" id="v" value="1" step="any" aria-label="Value"><select id="a" aria-label="From"></select><button class="btn sec" id="sw" type="button" aria-label="Swap units">⇄</button><select id="z" aria-label="To"></select></div><div class="out" id="o"></div><div class="stats" id="all"></div>';
 const cat=$('#cat',b),a=$('#a',b),z=$('#z',b),v=$('#v',b),o=$('#o',b),all=$('#all',b);
 Object.keys(U).forEach(k=>cat.appendChild(el('option',{},k)));
 const conv=(x,f,t)=>{const c=cat.value;if(c==='Temperature'){const k=f==='°C'?x+273.15:f==='°F'?(x-32)*5/9+273.15:x;return t==='°C'?k-273.15:t==='°F'?(k-273.15)*9/5+32:k}return x*U[c][f]/U[c][t]};
 const nf=r=>r.toLocaleString('en-US',{maximumSignificantDigits:8});
 function up(){const x=parseFloat(v.value);if(isNaN(x)){o.textContent='–';all.innerHTML='';return}
  o.innerHTML=x+' '+a.value+' = <b>'+nf(conv(x,a.value,z.value))+'</b> '+z.value;
  all.innerHTML=Object.keys(U[cat.value]).filter(u=>u!==a.value).map(u=>'<div class="stat"><b style="font-size:1rem">'+nf(conv(x,a.value,u))+'</b><small>'+u+'</small></div>').join('')}
 function fill(){const us=Object.keys(U[cat.value]);a.innerHTML=z.innerHTML=us.map(u=>'<option>'+u+'</option>').join('');z.selectedIndex=1;up()}
 cat.onchange=fill;a.onchange=z.onchange=up;v.oninput=up;
 $('#sw',b).onclick=()=>{const t=a.value;a.value=z.value;z.value=t;up()};fill();
}},
{id:'color-converter',n:'Color Converter',i:'🎨',c:'Design',d:'Pick a color and get HEX, RGB, HSL and shades.',r(b){
 b.innerHTML='<div class="row"><input type="color" id="p" value="#5558ee" aria-label="Pick a color"><input type="text" id="hx" value="#5558ee" aria-label="Hex code" spellcheck="false"></div><div class="sw" id="sw"></div><div class="out mono" id="o1"></div><div class="out mono" id="o2"></div><div class="out mono" id="o3"></div><div class="info">Click a value or shade to copy it.</div><div class="shades" id="sh"></div>'+MSG;
 const p=$('#p',b),hx=$('#hx',b),m=$('.msg',b);
 const norm=s=>{s=s.trim().replace(/^#/,'');if(/^[0-9a-f]{3}$/i.test(s))s=s.split('').map(c=>c+c).join('');return /^[0-9a-f]{6}$/i.test(s)?'#'+s.toLowerCase():null};
 const h2x=(h,s,l)=>{s/=100;l/=100;const a=s*Math.min(l,1-l),f=n=>{const k=(n+h/30)%12,c=l-a*Math.max(-1,Math.min(k-3,9-k,1));return Math.round(255*c).toString(16).padStart(2,'0')};return '#'+f(0)+f(8)+f(4)};
 function up(h){
  const r=parseInt(h.slice(1,3),16),g=parseInt(h.slice(3,5),16),bl=parseInt(h.slice(5,7),16),R=r/255,G=g/255,B=bl/255,mx=Math.max(R,G,B),mn=Math.min(R,G,B),l=(mx+mn)/2,d=mx-mn,s=d?d/(1-Math.abs(2*l-1)):0;let hu=0;
  if(d){hu=mx===R?((G-B)/d)%6:mx===G?(B-R)/d+2:(R-G)/d+4;hu=Math.round(hu*60);if(hu<0)hu+=360}
  $('#sw',b).style.background=h;$('#o1',b).textContent=h.toUpperCase();$('#o2',b).textContent='rgb('+r+', '+g+', '+bl+')';$('#o3',b).textContent='hsl('+hu+', '+Math.round(s*100)+'%, '+Math.round(l*100)+'%)';
  const sh=$('#sh',b);sh.innerHTML='';[95,85,75,65,55,45,35,25,15].forEach(L=>{const c=h2x(hu,Math.round(s*100),L),x=el('button',{type:'button',title:c,'aria-label':'Copy '+c});x.style.background=c;x.onclick=()=>copy(c,m);sh.appendChild(x)});
 }
 p.oninput=()=>{hx.value=p.value;up(p.value)};
 hx.oninput=()=>{const n=norm(hx.value);if(n){p.value=n;up(n)}};
 ['o1','o2','o3'].forEach(i=>{const e=$('#'+i,b);e.style.cursor='pointer';e.title='Click to copy';e.onclick=()=>copy(e.textContent,m)});
 up(p.value);
}},
{id:'pdf-merge',n:'Merge PDF',i:'📚',c:'PDF',d:'Combine several PDFs into one file, in the order you choose.',r(b){
 b.innerHTML='<div id="pk"></div><div class="row"><button class="btn" id="go" type="button">Merge &amp; save</button></div>'+MSG;
 const m=$('.msg',b),p=picker('application/pdf','PDF files only. Use the arrows to set the order.');$('#pk',b).appendChild(p.el);
 $('#go',b).onclick=async()=>{
  const fs=p.get();if(fs.length<2){say(m,'Add at least two PDFs.',1);return}if(!needPDF(m))return;
  try{say(m,'Merging…');const out=await PDFLib.PDFDocument.create();

{id:'csv-json',n:'CSV ⇄ JSON',i:'🔀',c:'Convert',d:'Convert spreadsheet CSV data to JSON and back.',r(b){
 b.innerHTML='<textarea id="t" placeholder="Paste CSV or a JSON array of objects…"></textarea><div class="row"><select id="dl" aria-label="Delimiter"><option value=",">Comma</option><option value=";">Semicolon</option><option value="&#9;">Tab</option></select><button class="btn" id="a" type="button">CSV → JSON</button><button class="btn" id="z" type="button">JSON → CSV</button><button class="btn sec" id="sv" type="button">Save file</button></div>'+MSG;
 const t=$('#t',b),m=$('.msg',b);let kind='json';
 function parse(s,D){const r=[];let row=[],f='',q=0;for(let i=0;i<s.length;i++){const c=s[i];if(q){if(c==='"'){if(s[i+1]==='"'){f+='"';i++}else q=0}else f+=c}else if(c==='"')q=1;else if(c===D){row.push(f);f=''}else if(c==='\n'||c==='\r'){if(c==='\r'&&s[i+1]==='\n')i++;row.push(f);r.push(row);row=[];f=''}else f+=c}if(f||row.length){row.push(f);r.push(row)}return r}
 $('#a',b).onclick=()=>{const r=parse(t.value.trim(),$('#dl',b).value);if(r.length<2){say(m,'Need a header row and at least one data row.',1);return}
  t.value=JSON.stringify(r.slice(1).map(x=>{const o={};r[0].forEach((h,i)=>{o[h]=x[i]===undefined?'':x[i]});return o}),null,2);kind='json';say(m,'Converted ✓')};
 $('#z',b).onclick=()=>{try{const a=JSON.parse(t.value),D=$('#dl',b).value;if(!Array.isArray(a))throw 0;const h=[];a.forEach(o=>{Object.keys(o).forEach(k=>{if(h.indexOf(k)<0)h.push(k)})});
  const e=v=>{v=v==null?'':typeof v==='object'?JSON.stringify(v):String(v);return (v.indexOf(D)>-1||/["\n\r]/.test(v))?'"'+v.replace(/"/g,'""')+'"':v};
  t.value=[h.map(e).join(D)].concat(a.map(o=>h.map(k=>e(o[k])).join(D))).join('\n');kind='csv';say(m,'Converted ✓')}catch(x){say(m,'Input must be a JSON array of objects.',1)}};
 $('#sv',b).onclick=()=>{if(!t.value){say(m,'Nothing to save.',1);return}dl(t.value,'converted.'+kind,m)};
}},
{id:'qr-generator',n:'QR Code Generator',i:'📱',c:'Generate',d:'QR codes for links, text, Wi-Fi, UPI payments and WhatsApp.',r(b){
 const T={Text:[['Text or URL','https://example.com']],WiFi:[['Network name',''],['Password',''],['Security','','select',['WPA','WEP','nopass']]],UPI:[['UPI ID','','name@bank'],['Payee name',''],['Amount (optional)',''],['Note (optional)','']],WhatsApp:[['Phone with country code','','919876543210'],['Message (optional)','']]};
 b.innerHTML='<div class="row"><select id="ty" aria-label="QR type">'+Object.keys(T).map(k=>'<option>'+k+'</option>').join('')+'</select><select id="sz" aria-label="Size"><option value="256">256 px</option><option value="512" selected>512 px</option><option value="1024">1024 px</option></select><input type="color" id="fg" value="#000000" aria-label="QR color" style="max-width:70px"></div><div id="fl"></div><canvas id="c" style="max-width:100%;height:auto;border-radius:10px;border:1px solid var(--bd)"></canvas><div class="row"><button class="btn" id="sv" type="button">Save PNG</button></div>'+MSG;
 const m=$('.msg',b),c=$('#c',b),fl=$('#fl',b);let drawn=false;
 const val=i=>{const e=$('#q'+i,b);return e?e.value.trim():''};
 const wf=s=>s.replace(/([\\;,:"])/g,'\\$1');
 function payload(){const t=$('#ty',b).value;
  if(t==='Text')return val(0);
  if(!val(0))return '';
  if(t==='WiFi')return 'WIFI:T:'+val(2)+';S:'+wf(val(0))+';'+(val(2)==='nopass'?'':'P:'+wf(val(1))+';')+';';
  if(t==='UPI')return 'upi://pay?pa='+val(0)+'&pn='+encodeURIComponent(val(1))+'&cu=INR'+(val(2)?'&am='+encodeURIComponent(val(2)):'')+(val(3)?'&tn='+encodeURIComponent(val(3)):'');
  return 'https://wa.me/'+val(0).replace(/\D/g,'')+(val(1)?'?text='+encodeURIComponent(val(1)):'');
 }
 function draw(){
  const p=payload(),x=c.getContext('2d');
  if(!p){drawn=false;c.width=c.height=1;say(m,'Fill in the first field to see your QR code.');return}
  try{const q=qrcode(0,'M');q.addData(p);q.make();const n=q.getModuleCount(),mg=2,cell=Math.max(1,Math.floor(+$('#sz',b).value/(n+mg*2))),s=cell*(n+mg*2);
   c.width=c.height=s;x.fillStyle='#fff';x.fillRect(0,0,s,s);x.fillStyle=$('#fg',b).value;
   for(let r=0;r<n;r++)for(let k=0;k<n;k++)if(q.isDark(r,k))x.fillRect((k+mg)*cell,(r+mg)*cell,cell,cell);
   drawn=true;say(m,'');
  }catch(e){drawn=false;say(m,'That is too long for a QR code, or the QR library did not load.',1)}
 }
 function fields(){const t=$('#ty',b).value;fl.innerHTML='';
  T[t].forEach((f,i)=>{const d=el('div',{'class':'fld'});
   if(f[2]==='select'){d.innerHTML='<label>'+f[0]+'<select id="q'+i+'">'+f[3].map(o=>'<option>'+o+'</option>').join('')+'</select></label>'}
   else{d.innerHTML='<label>'+f[0]+'<input type="text" id="q'+i+'" placeholder="'+(f[2]||'')+'"></label>';$('input',d).value=f[1]}
   fl.appendChild(d);$('#q'+i,b).oninput=draw;$('#q'+i,b).onchange=draw});draw()}
 $('#ty',b).onchange=fields;$('#sz',b).onchange=draw;$('#fg',b).oninput=draw;
 $('#sv',b).onclick=async()=>{if(!drawn){say(m,'Nothing to save yet.',1);return}await dl(await blob(c,'image/png'),'qr-code.png',m)};
 fields();
}},

  return a+'% of '+y+' = <b>'+r(a*y/100)+'</b><br>'+a+' is <b>'+r(a/y*100)+'%</b> of '+y+'<br>Change from '+a+' to '+y+' = <b>'+r((y-a)/a*100)+'%</b>'});
